name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scanview/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            scanview/package-lock.json

      # PropView (real-estate 3D viewer) -> served at the site root
      - name: Install PropView frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build PropView frontend
        working-directory: frontend
        env:
          # Set this as a repository variable (Settings > Secrets and
          # variables > Actions > Variables) pointing at your deployed
          # backend, e.g. https://propview-api.onrender.com/api
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_USE_HASH_ROUTER: "true"
        run: npm run build

      # ScanView (generic multi-view object scanner) -> served under /scanview/
      - name: Install ScanView deps
        working-directory: scanview
        run: npm ci --legacy-peer-deps

      - name: Build ScanView
        working-directory: scanview
        env:
          VITE_USE_HASH_ROUTER: "true"
        run: npm run build

      # Both apps are static SPAs with no shared server, so they're combined
      # into one Pages artifact: PropView at the root, ScanView under /scanview/.
      - name: Combine builds for Pages
        run: |
          mkdir -p combined
          cp -r frontend/dist/. combined/
          mkdir -p combined/scanview
          cp -r scanview/dist/. combined/scanview/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
