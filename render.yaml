services:
  - type: web
    name: propview-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: uploads
      - key: SCAN_STORAGE_DIR
        value: storage
      - key: RECONSTRUCTION_PROVIDER
        value: "null"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
